<script>
/* =========================================================================
   FAMILY ALBUM — functional demo build
   Persistence: window.storage (shared=true) acts as the app's backend.
   NOTE ON SESSION: per platform rules this artifact can't use
   localStorage/sessionStorage, so login state lives in memory only and
   resets on refresh — everything else (accounts, families, media,
   comments, guest access, notifications) persists for real.
   ========================================================================= */

// ---------- tiny storage helpers ----------
async function sget(key){ try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function sset(key, val){ try{ return await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed', key, e); return null; } }
async function sdel(key){ try{ return await window.storage.delete(key, true); }catch(e){ return null; } }
async function slist(prefix){ try{ const r = await window.storage.list(prefix, true); return r ? r.keys : []; }catch(e){ return []; } }

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function famCode(){ const n = Math.floor(1000+Math.random()*9000); return 'FAM-'+n; }
function guestCode(){ return 'GUEST-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<2592000) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:'');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(), 3400);
}

// ---------- global state (in-memory session) ----------
const STATE = {
  user: null,            // {email,name,avatar}
  guest: null,           // {id,albumId,name,email} when in guest mode
  route: 'landing',      // current view
  routeParam: null,
  activeFamilyId: null,
  families: [],           // families current user belongs to [{...family, membership}]
  notifCache: [],
  loading: false,
};

function render(){ ROUTES[STATE.route] ? ROUTES[STATE.route]() : ROUTES.landing(); window.scrollTo(0,0); }
function go(route, param){ STATE.route = route; STATE.routeParam = param; render(); }
const app = ()=>document.getElementById('app');

// ============================= DATA LAYER =============================

async function createUser(name, email, password) {
  email = email.trim().toLowerCase();

  const {
    createUserWithEmailAndPassword,
    sendEmailVerification,
    updateProfile
  } = window.firebaseFunctions;

  const result = await createUserWithEmailAndPassword(
    window.firebaseAuth,
    email,
    password
  );

  await updateProfile(result.user, {
    displayName: name
  });

  await sendEmailVerification(result.user);

  const user = {
    uid: result.user.uid,
    email: result.user.email,
    name: name,
    avatar: null,
    createdAt: Date.now()
  };

  await window.firebaseFunctions.setDoc(
    window.firebaseFunctions.doc(
      window.firebaseDb,
      "users",
      result.user.uid
    ),
    user
  );

  return user;
}


async function loginUser(email, password) {
  email = email.trim().toLowerCase();

  const { signInWithEmailAndPassword, doc, getDoc } =
    window.firebaseFunctions;

  const result = await signInWithEmailAndPassword(
    window.firebaseAuth,
    email,
    password
  );

  if (!result.user.emailVerified) {
    throw new Error(
      "Please verify your email before logging in. Check your inbox."
    );
  }

  const userDoc = await getDoc(
    doc(window.firebaseDb, "users", result.user.uid)
  );

  if (userDoc.exists()) {
    return userDoc.data();
  }

  return {
    uid: result.user.uid,
    email: result.user.email,
    name: result.user.displayName || "Family Member",
    avatar: null
  };
}

async function getUserFamilies(email){
  const { collection, getDocs, doc, getDoc } = window.firebaseFunctions;
  const db = window.firebaseDb;
  const user = firebaseAuth.currentUser;

  if (!user) return [];

  const families = [];

  const familiesSnapshot = await getDocs(
    collection(db, "families")
  );

  for (const familyDoc of familiesSnapshot.docs) {
    const family = familyDoc.data();

    const memberRef = doc(
      db,
      "families",
      familyDoc.id,
      "members",
      user.uid
    );

    const memberDoc = await getDoc(memberRef);

    if (memberDoc.exists()) {
      families.push({
        ...family,
        id: familyDoc.id,
        membership: memberDoc.data()
      });
    }
  }

  return families;
}
async function createFamily(owner, data) {
  const { collection, addDoc, doc, setDoc } =
    window.firebaseFunctions;

  const code = Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();

  // Create the family
  const familyRef = await addDoc(
    collection(window.firebaseDb, "families"),
    {
      name: data.name,
      description: data.description || "",
      photo: data.photo || null,
      location: data.location || "",
      origin: data.origin || "",
      foundedYear: data.foundedYear || "",
      createdBy: owner.uid,
      createdByEmail: owner.email,
      code: code,
      createdAt: Date.now()
    }
  );

  // Create the owner's membership
  await setDoc(
    doc(
      window.firebaseDb,
      "families",
      familyRef.id,
      "members",
      owner.uid
    ),
    {
      uid: owner.uid,
      email: owner.email,
      name: owner.name,
      role: "primary_admin",
      relationship: "Me",
      status: "approved",
      joinedAt: Date.now()
    }
  );

  return {
    id: familyRef.id,
    name: data.name,
    description: data.description || "",
    photo: data.photo || null,
    location: data.location || "",
    origin: data.origin || "",
    foundedYear: data.foundedYear || "",
    createdBy: owner.uid,
    code: code,
    createdAt: Date.now()
  };
}

async function requestJoinFamily(user, code, relationship){
  const fid = await sget('famCode:'+code.trim().toUpperCase());
  if(!fid) throw new Error('That family code was not found. Double-check it and try again.');
  const existingMem = await sget('memberships:'+fid+':'+user.email);
  if(existingMem) throw new Error('You already have a membership (status: '+existingMem.status+') with this family.');
  await sset('memberships:'+fid+':'+user.email, { role:'member', relationship: relationship||'', status:'pending', joinedAt: Date.now() });
  const list = await sget('userFamilies:'+user.email) || [];
  if(!list.includes(fid)) list.push(fid);
  await sset('userFamilies:'+user.email, list);
  const fam = await sget('families:'+fid);
  // notify admins
  const memberKeys = await slist('memberships:'+fid+':');
  for(const k of memberKeys){
    const m = await sget(k);
    if(m && (m.role==='primary_admin'||m.role==='admin') && m.status==='approved'){
      const adminEmail = k.split(':')[2];
      await notify(adminEmail, 'join_request', 'New family member request', user.name+' wants to join '+fam.name+'.');
    }
  }
  return fam;
}

async function getFamilyMembers(familyId){
  const keys = await slist('memberships:'+familyId+':');
  const out = [];
  for(const k of keys){
    const email = k.split(':').slice(2).join(':');
    const mem = await sget(k);
    const user = await sget('users:'+email);
    if(mem && user) out.push({email, ...mem, name:user.name, avatar:user.avatar});
  }
  out.sort((a,b)=> (a.joinedAt||0)-(b.joinedAt||0));
  return out;
}

async function setMembership(familyId, email, patch){
  const key = 'memberships:'+familyId+':'+email;
  const mem = await sget(key);
  if(!mem) return;
  await sset(key, {...mem, ...patch});
}

async function removeMembership(familyId, email){
  await sdel('memberships:'+familyId+':'+email);
  const list = await sget('userFamilies:'+email) || [];
  await sset('userFamilies:'+email, list.filter(f=>f!==familyId));
}

async function notify(email, type, title, message){
  const id = uid('ntf');
  await sset('notif:'+email+':'+id, { type, title, message, read:false, createdAt: Date.now() });
}
async function getNotifications(email){
  const keys = await slist('notif:'+email+':');
  const out = [];
  for(const k of keys){ const n = await sget(k); if(n) out.push({key:k, ...n}); }
  out.sort((a,b)=>b.createdAt-a.createdAt);
  return out;
}

async function createAlbum(familyId, user, data){
  const id = uid('alb');
  const album = {
    id, familyId, name:data.name, description:data.description||'', cover:null,
    createdBy:user.email, createdByName:user.name, createdAt: Date.now(),
    isArchive: !!data.isArchive, allowGuestDownloads:false
  };
  await sset('albums:'+familyId+':'+id, album);
  await logActivity(familyId, user.name+' created the album "'+data.name+'".');
  return album;
}
async function getAlbums(familyId){
  const keys = await slist('albums:'+familyId+':');
  const out = [];
  for(const k of keys){ const a = await sget(k); if(a) out.push(a); }
  out.sort((a,b)=>b.createdAt-a.createdAt);
  return out;
}
async function getAlbum(familyId, albumId){ return await sget('albums:'+familyId+':'+albumId); }

async function addMedia(familyId, albumId, uploader, data){
  const id = uid('med');
  const media = {
    id, familyId, albumId, uploadedBy: uploader.email, uploadedByName: uploader.name,
    type: data.type, dataUrl: data.dataUrl, videoUrl: data.videoUrl||null,
    caption: data.caption||'', location: data.location||'', takenAt: data.takenAt || Date.now(),
    createdAt: Date.now()
  };
  await sset('media:'+familyId+':'+id, media);
  const album = await getAlbum(familyId, albumId);
  if(album && !album.cover && data.type==='photo'){ album.cover = data.dataUrl; await sset('albums:'+familyId+':'+albumId, album); }
  await logActivity(familyId, uploader.name+' uploaded a '+data.type+(album?' to "'+album.name+'"':'')+'.');
  // notify other approved members
  const members = await getFamilyMembers(familyId);
  for(const m of members){
    if(m.email!==uploader.email && m.status==='approved'){
      await notify(m.email, 'new_media', 'New '+data.type, uploader.name+' added a new '+data.type+(album?' to '+album.name:'')+'.');
    }
  }
  return media;
}
async function getMediaForAlbum(familyId, albumId){
  const keys = await slist('media:'+familyId+':');
  const out = [];
  for(const k of keys){ const m = await sget(k); if(m && m.albumId===albumId) out.push(m); }
  out.sort((a,b)=>a.createdAt-b.createdAt);
  return out;
}
async function getAllMedia(familyId){
  const keys = await slist('media:'+familyId+':');
  const out = [];
  for(const k of keys){ const m = await sget(k); if(m) out.push(m); }
  out.sort((a,b)=>b.createdAt-a.createdAt);
  return out;
}

async function logActivity(familyId, text){
  const id = uid('act');
  await sset('activity:'+familyId+':'+id, { text, createdAt: Date.now() });
}
async function getActivity(familyId, limit){
  const keys = await slist('activity:'+familyId+':');
  const out = [];
  for(const k of keys){ const a = await sget(k); if(a) out.push(a); }
  out.sort((a,b)=>b.createdAt-a.createdAt);
  return limit ? out.slice(0,limit) : out;
}

async function addComment(mediaId, authorLabel, authorType, content, parentId){
  const id = uid('cmt');
  await sset('comment:'+mediaId+':'+id, { authorLabel, authorType, content, parentId: parentId||null, createdAt: Date.now() });
  return id;
}
async function getComments(mediaId){
  const keys = await slist('comment:'+mediaId+':');
  const out = [];
  for(const k of keys){ const c = await sget(k); if(c) out.push({key:k, ...c}); }
  out.sort((a,b)=>a.createdAt-b.createdAt);
  return out;
}

async function toggleReaction(mediaId, actorKey, type){
  const key = 'rxn:'+mediaId+':'+actorKey;
  const existing = await sget(key);
  if(existing && existing.type===type){ await sdel(key); return null; }
  await sset(key, { type, createdAt: Date.now() });
  return type;
}
async function getReactions(mediaId){
  const keys = await slist('rxn:'+mediaId+':');
  const out = [];
  for(const k of keys){ const r = await sget(k); if(r) out.push({actor:k.split(':')[2], ...r}); }
  return out;
}

async function inviteGuests(familyId, albumId, inviter, guestsInput){
  // guestsInput: array of {name, email}
  const created = [];
  for(const g of guestsInput){
    if(!g.name || !g.email) continue;
    const id = uid('gst');
    const code = guestCode();
    const rec = { id, albumId, familyId, name:g.name, email:g.email.trim().toLowerCase(), code, status:'active', invitedBy:inviter.email, createdAt: Date.now(), removedAt:null };
    await sset('guest:'+albumId+':'+id, rec);
    created.push(rec);
  }
  return created;
}
async function getGuestsForAlbum(albumId){
  const keys = await slist('guest:'+albumId+':');
  const out = [];
  for(const k of keys){ const g = await sget(k); if(g) out.push(g); }
  out.sort((a,b)=>a.createdAt-b.createdAt);
  return out;
}
async function removeGuest(albumId, guestId){
  const key = 'guest:'+albumId+':'+guestId;
  const g = await sget(key);
  if(g){ g.status='removed'; g.removedAt=Date.now(); await sset(key,g); }
}
async function guestLogin(code, email){
  // search all guest keys — scoped scan by known album isn't possible without albumId,
  // so we keep a lookup index by code.
  const albumId = await sget('guestCode:'+code.trim().toUpperCase());
  if(!albumId) throw new Error('Guest code not recognized.');
  const keys = await slist('guest:'+albumId+':');
  for(const k of keys){
    const g = await sget(k);
    if(g && g.code===code.trim().toUpperCase() && g.email===email.trim().toLowerCase()){
      if(g.status==='removed') throw new Error('This guest access has been removed by the family admin.');
      return g;
    }
  }
  throw new Error('No matching guest invitation found for that code and email.');
}

// patch inviteGuests to also write the code index
const _origInviteGuests = inviteGuests;
inviteGuests = async function(familyId, albumId, inviter, guestsInput){
  const created = await _origInviteGuests(familyId, albumId, inviter, guestsInput);
  for(const g of created){ await sset('guestCode:'+g.code, albumId); }
  const album = await getAlbum(familyId, albumId);
  for(const g of created){
    await logActivity(familyId, inviter.name+' invited '+g.name+' as a guest to "'+(album?album.name:'an album')+'".');
  }
  return created;
};

// ============================= IMAGE HELPERS =============================
function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{ img.onload = ()=>{
        let {width,height} = img;
        if(width>height && width>maxDim){ height*=maxDim/width; width=maxDim; }
        else if(height>maxDim){ width*=maxDim/height; height=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.78));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============================= UI: SHELL =============================

function shell(innerHtml, opts){
  opts = opts || {};
  const loggedIn = !!STATE.user;
  const fam = currentFamily();
  return `
    <div class="topnav"><div class="container topnav-inner">
      <a class="brand" href="#" onclick="go('${loggedIn?'dashboard':'landing'}');return false;">
        <span class="mark">◆</span> Family Album
      </a>
      ${loggedIn ? `
      <div class="nav-links">
        ${navLink('dashboard','Home')}
        ${navLink('albums','Albums')}
        ${navLink('timeline','Timeline')}
        ${navLink('archive','Archive')}
        ${navLink('members','Family')}
      </div>
      <div class="nav-right">
        ${fam ? famSwitcher() : ''}
        <button class="icon-btn" title="Upload" onclick="openUploadModal()">⤴</button>
        <button class="icon-btn" title="Notifications" onclick="go('notifications')">🔔${opts.unread?'<span class="dot"></span>':''}</button>
        <a class="avatar avatar-sm" href="#" onclick="go('profile');return false;" title="${esc(STATE.user.name)}">${STATE.user.avatar?`<img src="${STATE.user.avatar}">`:initials(STATE.user.name)}</a>
      </div>` : `
      <div class="nav-right">
        <a class="btn btn-ghost btn-sm" href="#" onclick="go('login');return false;">Log in</a>
        <a class="btn btn-primary btn-sm" href="#" onclick="go('register');return false;">Get started</a>
      </div>`}
    </div></div>
    <div>${innerHtml}</div>
    ${loggedIn ? `<div class="bottomnav">
      ${bnav('dashboard','⌂','Home')}
      ${bnav('albums','▦','Albums')}
      ${bnav('timeline','☰','Timeline')}
      ${bnav('members','◎','Family')}
      ${bnav('notifications','🔔','Alerts')}
    </div>
    <button class="fab-upload" onclick="openUploadModal()">⤴</button>` : ''}
  `;
}
function navLink(route,label){
  return `<a class="nav-link ${STATE.route===route?'active':''}" href="#" onclick="go('${route}');return false;">${label}</a>`;
}
function bnav(route,ic,label){
  return `<a class="${STATE.route===route?'active':''}" href="#" onclick="go('${route}');return false;"><span class="bicon">${ic}</span>${label}</a>`;
}
function currentFamily(){ return STATE.families.find(f=>f.id===STATE.activeFamilyId); }
function famSwitcher(){
  const fam = currentFamily();
  if(!fam) return '';
  return `<div class="fam-switch" onclick="openFamilySwitcher()">
    <span class="avatar avatar-sm">${fam.photo?`<img src="${fam.photo}">`:initials(fam.name)}</span>
    <span>${esc(fam.name)}</span> <span style="opacity:.5">▾</span>
  </div>`;
}
function isAdmin(fam){ return fam && (fam.membership.role==='primary_admin'||fam.membership.role==='admin'); }
function isPrimary(fam){ return fam && fam.membership.role==='primary_admin'; }

async function requireFamilyContext(){
  if(!STATE.user){ go('landing'); return false; }
  STATE.families = await getUserFamilies(STATE.user.email);
  const approved = STATE.families.filter(f=>f.membership.status==='approved');
  if(!STATE.activeFamilyId || !approved.find(f=>f.id===STATE.activeFamilyId)){
    STATE.activeFamilyId = approved[0] ? approved[0].id : null;
  }
  return true;
}

async function openUploadModal(presetAlbumId){
  const fam = currentFamily();
  const albums = await getAlbums(fam.id);
  openModal(`
    <h2>Upload photos &amp; videos</h2>
    <label>Album</label>
    <select id="upAlbum">
      ${albums.map(a=>`<option value="${a.id}" ${a.id===presetAlbumId?'selected':''}>${esc(a.name)}</option>`).join('') || '<option disabled>Create an album first</option>'}
    </select>
    <label>Caption (applies to all files this batch)</label><input id="upCaption" placeholder="Optional caption">
    <div class="dz" id="dz" style="margin-top:16px" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:26px">⤴</div>
      <p><b>Drag and drop</b> photos or videos here, or click to choose files</p>
      <p class="small">JPG, PNG, WEBP, MP4, MOV — images are optimized automatically for fast loading</p>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
    <div id="upList" style="margin-top:12px"></div>
  `);
  if(albums.length===0){ toast('Create an album first', 'err'); }
  const dz = document.getElementById('dz');
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop', e=>handleFiles(e.dataTransfer.files));
  document.getElementById('fileInput').addEventListener('change', e=>handleFiles(e.target.files));
}
async function handleFiles(fileList){
  const files = Array.from(fileList);
  if(files.length===0) return;
  const albumId = document.getElementById('upAlbum').value;
  const caption = document.getElementById('upCaption').value;
  const listEl = document.getElementById('upList');
  if(!albumId){ toast('Choose or create an album first', 'err'); return; }
  for(const file of files){
    const rowId = uid('row');
    const isVideo = file.type.startsWith('video');
    listEl.insertAdjacentHTML('beforeend', `<div class="upload-row" id="${rowId}"><span>${isVideo?'🎬':'🖼'}</span><span style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(file.name)}</span><div class="progress"><div style="width:15%"></div></div><span class="status">…</span></div>`);
    const row = document.getElementById(rowId);
    const bar = row.querySelector('.progress > div');
    const status = row.querySelector('.status');
    try{
      if(isVideo && file.size > 4.5*1024*1024){
        throw new Error('Video too large for demo storage (4.5MB limit). In production this uploads to cloud video storage.');
      }
      bar.style.width='45%';
      let dataUrl;
      if(isVideo){
        dataUrl = await fileToDataUrlRaw(file);
      } else {
        dataUrl = await fileToCompressedDataUrl(file, 1600, 0.78);
      }
      bar.style.width='80%';
      await addMedia(STATE.activeFamilyId, albumId, STATE.user, { type: isVideo?'video':'photo', dataUrl, caption });
      bar.style.width='100%';
      status.textContent = '✓';
    }catch(err){
      status.textContent = '⚠';
      status.title = err.message;
      row.insertAdjacentHTML('beforeend', `<button class="btn btn-sm btn-ghost" onclick="toast('${esc(err.message)}','err')">details</button>`);
    }
  }
  toast('Upload complete', 'ok');
}
function fileToDataUrlRaw(file){
  return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}

  await renderViewer();
}
async function renderViewer(){
  const m = viewerState.list[viewerState.index];
  if(!m) return;
  const comments = await getComments(m.id);
  const reactions = await getReactions(m.id);
  const actorKey = STATE.guest ? 'guest_'+STATE.guest.id : STATE.user.email;
  const counts = {};
  reactions.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);
  const mine = reactions.find(r=>r.actor===actorKey);
  const topLevel = comments.filter(c=>!c.parentId);
  const repliesOf = pid => comments.filter(c=>c.parentId===pid);

  let el = document.getElementById('viewerRoot');
  if(!el){ el = document.createElement('div'); el.id='viewerRoot'; document.body.appendChild(el); }
  el.innerHTML = `
  <div class="viewer-backdrop">
    <div class="viewer-main">
      <div class="viewer-top" style="position:absolute;top:0;left:0;right:0">
        <span>${esc(m.uploadedByName)} · ${new Date(m.takenAt).toLocaleDateString()}</span>
        <button class="modal-close" style="position:static;background:rgba(255,255,255,.15);border:none;color:#fff" onclick="closeViewer()">✕</button>
      </div>
      ${viewerState.index>0?`<button class="viewer-nav prev" onclick="stepViewer(-1)">‹</button>`:''}
      ${m.type==='video' ? `<video class="viewer-media" src="${m.videoUrl||m.dataUrl}" controls autoplay></video>` : `<img class="viewer-media" src="${m.dataUrl}">`}
      ${viewerState.index<viewerState.list.length-1?`<button class="viewer-nav next" onclick="stepViewer(1)">›</button>`:''}
    </div>
    <div class="viewer-panel">
      ${m.caption?`<p style="margin:0 0 10px">${esc(m.caption)}</p>`:''}
      <div class="reaction-bar">
        ${['❤️','😂','😍','👏','🎉'].map(e=>`<button class="rxn ${mine&&mine.type===e?'mine':''}" onclick="doReact('${m.id}','${e}')">${e} ${counts[e]||''}</button>`).join('')}
      </div>
      <div class="divider"></div>
      <div id="commentList">
        ${topLevel.length===0?`<p class="muted small">No comments yet. Be the first to say something.</p>`:''}
        ${topLevel.map(c=>commentHtml(c)+repliesOf(c.key.split(':')[2]||'').map(r=>commentHtml(r,true)).join('')).join('')}
      </div>
      <form id="commentForm" style="margin-top:14px;display:flex;gap:8px">
        <input id="commentInput" placeholder="Write a comment..." style="flex:1">
        <button class="btn btn-primary btn-sm" type="submit">Post</button>
      </form>
    </div>
  </div>`;
  document.getElementById('commentForm').onsubmit = async (e)=>{
    e.preventDefault();
    const input = document.getElementById('commentInput');
    if(!input.value.trim()) return;
    const label = STATE.guest ? STATE.guest.name+'|guest' : STATE.user.name+'|member';
    await addComment(m.id, label, STATE.guest?'guest':'member', input.value.trim(), null);
    input.value='';
    renderViewer();
  };
}
function commentHtml(c, isReply){
  const [name, type] = c.authorLabel.split('|');
  return `<div class="comment ${isReply?'reply':''}">
    <span class="avatar avatar-sm">${initials(name)}</span>
    <div class="body">
      <div class="head">${esc(name)} ${type==='guest'?'<span class="badge badge-guest">Guest</span>':''}</div>
      <div class="txt">${esc(c.content)}</div>
      <div class="meta">${timeAgo(c.createdAt)}${!isReply?`<span class="reply-link" onclick="startReply('${c.key.split(':')[2]}')">Reply</span>`:''}</div>
    </div>
  </div>`;
}
function startReply(commentId){
  const input = document.getElementById('commentInput');
  input.focus();
  document.getElementById('commentForm').onsubmit = async (e)=>{
    e.preventDefault();
    if(!input.value.trim()) return;
    const m = viewerState.list[viewerState.index];
    const label = STATE.guest ? STATE.guest.name+'|guest' : STATE.user.name+'|member';
    await addComment(m.id, label, STATE.guest?'guest':'member', input.value.trim(), commentId);
    input.value='';
    renderViewer();
  };
  toast('Replying — write your reply and press Post');
}
async function doReact(mediaId, type){
  const actorKey = STATE.guest ? 'guest_'+STATE.guest.id : STATE.user.email;
  await toggleReaction(mediaId, actorKey, type);
  renderViewer();
}
function stepViewer(delta){ viewerState.index += delta; renderViewer(); }
function closeViewer(){ const el = document.getElementById('viewerRoot'); if(el) el.remove(); render(); }
document.addEventListener('keydown', e=>{
  if(!document.getElementById('viewerRoot')) return;
  if(e.key==='ArrowRight') stepViewer(1);
  if(e.key==='ArrowLeft') stepViewer(-1);
  if(e.key==='Escape') closeViewer();
});

// ---------- MEMBERS / ADMIN ----------
ROUTES.members = async function(){
  if(!(await requireFamilyContext())) return;
  const fam = currentFamily(); if(!fam){ go('onboarding'); return; }
  const members = await getFamilyMembers(fam.id);
  const approved = members.filter(m=>m.status==='approved');
  const pending = members.filter(m=>m.status==='pending');
  const admin = isAdmin(fam);
  app().innerHTML = shell(`
    <div class="page container">
      <div class="page-head">
        <div><h1>Family</h1><p class="muted">${esc(fam.name)} · code <b>${fam.code}</b></p></div>
        ${admin ? `<button class="btn btn-primary" onclick="openInviteModal()">Invite family member</button>` : ''}
      </div>
      ${admin && pending.length>0 ? `
      <div class="card" style="border-color:var(--gold);margin-bottom:22px">
        <h3 style="margin:0 0 10px">Pending requests (${pending.length})</h3>
        <div class="members-list">
          ${pending.map(m=>`<div class="member-row">
            <span class="avatar avatar-sm">${initials(m.name)}</span>
            <div class="member-meta"><div class="mname">${esc(m.name)}</div><div class="msub">${esc(m.email)} ${m.relationship?'· '+esc(m.relationship):''} · requested ${timeAgo(m.joinedAt)}</div></div>
            <div class="member-actions">
              <button class="btn btn-sage btn-sm" onclick="approveMember('${fam.id}','${m.email}')">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="declineMember('${fam.id}','${m.email}')">Decline</button>
            </div>
          </div>`).join('')}
        </div>
      </div>` : ''}
      <div class="card">
        <h3 style="margin:0 0 10px">Members (${approved.length})</h3>
        <div class="members-list">
          ${approved.map(m=>`<div class="member-row">
            <span class="avatar avatar-sm">${m.avatar?`<img src="${m.avatar}">`:initials(m.name)}</span>
            <div class="member-meta"><div class="mname">${esc(m.name)} ${m.email===STATE.user.email?'(you)':''}</div><div class="msub">${esc(m.relationship||'—')} · joined ${timeAgo(m.joinedAt)}</div></div>
            <span class="badge ${m.role==='primary_admin'?'badge-primary':m.role==='admin'?'badge-admin':'badge-pending'}">${roleLabel(m.role)}</span>
            ${admin && m.role!=='primary_admin' && m.email!==STATE.user.email ? `
            <div class="member-actions">
              ${m.role==='member' ? `<button class="btn btn-ghost btn-sm" onclick="promoteMember('${fam.id}','${m.email}')">Make admin</button>` : `<button class="btn btn-ghost btn-sm" onclick="demoteMember('${fam.id}','${m.email}')">Remove admin</button>`}
              <button class="btn btn-danger btn-sm" onclick="removeMember('${fam.id}','${m.email}')">Remove</button>
            </div>` : ''}
          </div>`).join('')}
        </div>
      </div>
    </div>
  `);
};
function openInviteModal(){
  const fam = currentFamily();
  openModal(`
    <h2>Invite family</h2>
    <p class="muted small">Share this code or link with the person you're inviting. They'll submit a request that you approve here.</p>
    <div class="code-chip">${fam.code} <span style="cursor:pointer" onclick="navigator.clipboard&&navigator.clipboard.writeText('${fam.code}');toast('Code copied')">⧉</span></div>
    <p class="hint" style="margin-top:14px">They can use this code on the "Join a family" page after creating their own account.</p>
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="closeModal()">Done</button>
  `);
}
async function approveMember(famId, email){
  await setMembership(famId, email, {status:'approved'});
  await notify(email, 'approval', "You're in!", 'Your request to join has been approved.');
  const fam = await sget('families:'+famId);
  await logActivity(famId, (await sget('users:'+email)).name+' joined the family.');
  toast('Member approved','ok'); go('members');
}
async function declineMember(famId, email){
  await removeMembership(famId, email);
  await notify(email, 'decline', 'Request declined', 'Your request to join was declined by an admin.');
  toast('Request declined'); go('members');
}
async function promoteMember(famId, email){
  await setMembership(famId, email, {role:'admin'});
  await notify(email, 'admin_promote', "You're now an Admin", 'You were promoted to Admin.');
  toast('Promoted to admin','ok'); go('members');
}
async function demoteMember(famId, email){
  await setMembership(famId, email, {role:'member'});
  toast('Admin role removed'); go('members');
}
async function removeMember(famId, email){
  if(!confirm('Remove this member from the family?')) return;
  await removeMembership(famId, email);
  await notify(email, 'member_removed', 'Removed from family', 'You were removed from a family space.');
  toast('Member removed'); go('members');
}

// ---------- NOTIFICATIONS ----------
ROUTES.notifications = async function(){
  if(!STATE.user){ go('login'); return; }
  const notifs = await getNotifications(STATE.user.email);
  app().innerHTML = shell(`
    <div class="page container" style="max-width:640px">
      <div class="page-head"><h1>Notifications</h1>${notifs.some(n=>!n.read)?`<button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button>`:''}</div>
      <div class="card">${notifs.length===0?`<p class="muted">No notifications yet.</p>`:notifs.map(notifRow).join('')}</div>
    </div>
  `);
  for(const n of notifs){ if(!n.read){ const r = await sget(n.key); if(r){ r.read=true; await sset(n.key,r);} } }
};
async function markAllRead(){ await ROUTES.notifications(); toast('Marked as read'); }

// ---------- TIMELINE ----------
ROUTES.timeline = async function(){
  if(!(await requireFamilyContext())) return;
  const fam = currentFamily(); if(!fam){ go('onboarding'); return; }
  const media = await getAllMedia(fam.id);
  const byYear = {};
  media.forEach(m=>{
    const d = new Date(m.takenAt);
    const y = d.getFullYear();
    byYear[y] = byYear[y] || [];
    byYear[y].push({m,d});
  });
  const years = Object.keys(byYear).sort((a,b)=>b-a);
  app().innerHTML = shell(`
    <div class="page container">
      <h1>Family Timeline</h1>
      ${years.length===0 ? emptyState('☰','No memories yet','Upload photos to start building your timeline.') :
      years.map(y=>`
        <div class="timeline-year">${y}</div>
        ${byYear[y].sort((a,b)=>b.d-a.d).map(({m,d})=>`
          <div class="timeline-event">
            <div class="tmonth">${d.toLocaleString('default',{month:'short'})}</div>
            <div>${esc(m.caption||(m.type==='video'?'Video':'Photo'))} <span class="small muted">— by ${esc(m.uploadedByName)}</span></div>
          </div>`).join('')}
      `).join('')}
    </div>
  `);
};

// ---------- PROFILE ----------
ROUTES.profile = function(){
  if(!STATE.user){ go('login'); return; }
  const u = STATE.user;
  app().innerHTML = shell(`
    <div class="page container" style="max-width:520px">
      <h1>Profile</h1>
      <div class="card">
        <div class="avatar avatar-lg" style="margin-bottom:14px">${u.avatar?`<img src="${u.avatar}">`:initials(u.name)}</div>
        <label>Photo</label><input type="file" id="avatarInput" accept="image/*">
        <label>Name</label><input id="pName" value="${esc(u.name)}">
        <label>Email</label><input value="${esc(u.email)}" disabled>
        <button class="btn btn-primary" style="margin-top:16px" onclick="saveProfile()">Save changes</button>
        <div class="divider"></div>
        <button class="btn btn-ghost" onclick="logout()">Log out</button>
      </div>
    </div>
  `);
  document.getElementById('avatarInput').onchange = async (e)=>{
    if(!e.target.files[0]) return;
    STATE.user.avatar = await fileToCompressedDataUrl(e.target.files[0], 300, 0.8);
  };
};
async function saveProfile(){
  STATE.user.name = document.getElementById('pName').value || STATE.user.name;
  await sset('users:'+STATE.user.email, STATE.user);
  toast('Profile updated','ok'); go('dashboard');
}
function logout(){ STATE.user=null; STATE.guest=null; STATE.activeFamilyId=null; STATE.families=[]; go('landing'); }

// ---------- MODAL helpers ----------
function openModal(html){
  let el = document.getElementById('modalRoot');
  if(!el){ el = document.createElement('div'); el.id='modalRoot'; document.body.appendChild(el); }
  el.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>${html}
  </div></div>`;
}
function closeModal(){ const el = document.getElementById('modalRoot'); if(el) el.innerHTML=''; }

// ============================= BOOTSTRAP =============================
render();
